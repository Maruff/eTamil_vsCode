# Build the extension for every platform from a published compiler release, and
# optionally publish it to the Visual Studio Marketplace and to Open VSX.
#
# Open VSX is what Cursor, Windsurf and VSCodium install from. They do not read
# the Visual Studio Marketplace, so without it eTamil does not exist for them.
#
# Run by hand (Actions > Publish > Run workflow) with the compiler release tag,
# for example v1.4.2. The release must already be published with its five
# archives, because each VSIX carries the compiler built for one platform:
# scripts/package_extension.py --from-release downloads them. The two checkouts
# mirror ci.yml: the compiler repository at the root, this one beneath it.
#
# With "publish" left off, this builds and uploads the VSIX files as a workflow
# artifact and publishes nothing, which is how to try it.

name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Compiler release to carry, e.g. v1.4.2 (must match this extension''s version)'
        required: true
        type: string
      publish:
        description: 'Publish to the Marketplace and Open VSX (otherwise only build)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the compiler at the release
        uses: actions/checkout@v4
        with:
          repository: Maruff/eTamil_lang
          ref: ${{ inputs.release_tag }}
          path: .

      - name: Check out this extension where it used to live
        uses: actions/checkout@v4
        with:
          path: eTamil_Code

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eTamil_Code/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A VSIX named for one version carrying another version's compiler is the
      # mistake this prevents.
      - name: The extension version matches the release
        working-directory: eTamil_Code
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "package.json is at $version but the release is $TAG" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: eTamil_Code
        run: npm ci

      - name: Build the VSIX files
        run: python scripts/package_extension.py --from-release "${{ inputs.release_tag }}"

      - name: List what was built
        working-directory: eTamil_Code
        run: |
          ls -lh ./*.vsix
          test "$(ls ./*.vsix | wc -l)" -eq 5 || { echo "expected five platform builds" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: eTamil_Code/*.vsix
          if-no-files-found: error

      # Each step publishes only when asked to, and says so when its token is
      # missing instead of failing after the other marketplace already has the
      # version.
      - name: Visual Studio Marketplace
        if: ${{ inputs.publish }}
        working-directory: eTamil_Code
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set; nothing was published to the Visual Studio Marketplace"
            exit 0
          fi
          for f in ./*.vsix; do npx vsce publish --packagePath "$f"; done

      - name: Open VSX
        if: ${{ inputs.publish }}
        working-directory: eTamil_Code
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; nothing was published to Open VSX"
            exit 0
          fi
          for f in ./*.vsix; do npx --yes ovsx publish "$f" -p "$OVSX_PAT"; done
